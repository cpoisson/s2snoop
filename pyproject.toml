[project]
name = "s2snoop"
version = "0.2.0"
description = "Observe OpenAI Realtime voice sessions live: latency, transcripts, tools, images, tokens, aligned audio replay."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["realtime", "voice", "speech-to-speech", "observability", "websocket", "openai-realtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/cpoisson/s2snoop"

[project.scripts]
s2snoop = "s2snoop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s2snoop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
